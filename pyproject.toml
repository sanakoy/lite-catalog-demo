[project]
name = "lite-catalog-demo"
version = "0.1.0"
description = "Imperative mapping"
readme = "README.md"
authors = [
    { name = "sanakoy", email = "boeiksanakoev@bk.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.1.6",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.mypy]
strict = true
files = ["src", "tests"]